  - { ts: "2026-05-04T02:00:00Z", scope: "payments — Tap to Pay", choice: "iOS / Android Tap-to-Pay marked 'unsupported_until_psp_listed' in compatibility matrix; can flip to 'live' WITHOUT code change once Valor reaches Apple's / Google's PSP allowlist (reachable as of training: Stripe, Adyen, Square, Fiserv, Toast — Valor not listed)", rationale: "Apple/Google control the PSP allowlist; we can't bypass without breaking the lock. Phone-as-terminal still possible via paired Bluetooth Valor sleeve (V9.10.4/5)." }

