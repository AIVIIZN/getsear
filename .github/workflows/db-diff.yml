name: db-diff

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/db-diff.mjs'
      - '.github/workflows/db-diff.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check Supabase drift-check credentials
        id: supabase_credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping linked Supabase db:diff because one or more SUPABASE_* secrets are not configured."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run schema drift check
        if: steps.supabase_credentials.outputs.available == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npm run db:diff
