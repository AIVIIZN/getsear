name: Security Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  rls-and-zap:
    name: RLS Fuzz + OWASP ZAP Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: RLS malicious-tenant fuzz suite
        run: npm run security:rls

      - name: Build production app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NODE_ENV: production
          SENTRY_DSN: ""
          NEXT_PUBLIC_SENTRY_DSN: ""
          SENTRY_AUTH_TOKEN: ""
          SENTRY_ORG: ""
          SENTRY_PROJECT: ""
          SENTRY_RELEASE: ${{ github.sha }}

      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/sear-zap-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/sear-zap-server.log
          exit 1

      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://127.0.0.1:3000
          fail_action: false
          allow_issue_writing: false
          cmd_options: -a -m 3 -T 10

      - name: Fail on high or critical ZAP alerts
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const report = JSON.parse(fs.readFileSync('report_json.json', 'utf8'))
          const alerts = report.site.flatMap((site) => site.alerts || [])
          const blocking = alerts.filter((alert) => Number(alert.riskcode) >= 3)
          if (blocking.length > 0) {
            for (const alert of blocking) {
              console.error(`${alert.riskdesc}: ${alert.name}`)
            }
            process.exit(1)
          }
          console.log(`ZAP high/critical alerts: 0 (${alerts.length} total non-blocking alerts reviewed)`)
          NODE
