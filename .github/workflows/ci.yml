name: CI

on:
  pull_request:
  push:
    branches: [main]

# Do NOT add auto-deploy here. Deploy is manual via build-pipeline/DEPLOY.sh.

jobs:
  ci:
    name: Build, Lint, Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Stub required env vars for the build step — no real secrets needed
          # for a static analysis / type-check / bundler pass.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_APP_URL: https://getsear.com
          NODE_ENV: production
          SENTRY_DSN: ""
          NEXT_PUBLIC_SENTRY_DSN: ""
          SENTRY_AUTH_TOKEN: ""
          SENTRY_ORG: ""
          SENTRY_PROJECT: ""
          SENTRY_RELEASE: ${{ github.sha }}
