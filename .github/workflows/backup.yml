name: backup

on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * *'

jobs:
  postgres-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install backup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client awscli

      - name: Check backup credentials
        id: backup_credentials
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_S3_BUCKET" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping backup because one or more backup secrets are not configured."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run daily backup
        if: steps.backup_credentials.outputs.available == 'true'
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_PREFIX: ${{ vars.BACKUP_S3_PREFIX || 'sear-pos/postgres' }}
          BACKUP_RETENTION_DAYS: '30'
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'us-east-1' }}
        run: bash scripts/backup.sh
