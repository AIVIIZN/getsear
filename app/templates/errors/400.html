{% extends "base_fullscreen.html" %}

{% block title %}400 - Bad Request{% endblock %}
{% block body_class %}bg-gray-50{% endblock %}

{% block content %}
<div class="flex items-center justify-center h-full p-6">
  <div class="text-center max-w-md">
    <div class="w-24 h-24 mx-auto mb-6 rounded-full bg-warning-50 flex items-center justify-center">
      <svg class="w-12 h-12 text-warning-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Bad Request</h1>
    <p class="text-gray-500 mb-8">The server couldn't understand that request. Try again or go back.</p>
    <a href="{{ url_for('pages.pos') }}" class="btn-primary btn-md">
      Back to POS
    </a>
  </div>
</div>
{% endblock %}
