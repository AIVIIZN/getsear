{% extends "base_fullscreen.html" %}

{% block title %}401 - Unauthorized{% endblock %}
{% block body_class %}bg-gray-50{% endblock %}

{% block content %}
<div class="flex items-center justify-center h-full p-6">
  <div class="text-center max-w-md">
    <div class="w-24 h-24 mx-auto mb-6 rounded-full bg-gray-100 flex items-center justify-center">
      <svg class="w-12 h-12 text-gray-300" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Authentication Required</h1>
    <p class="text-gray-500 mb-8">You need to sign in to access this page.</p>
    <a href="{{ url_for('pages.login_page') }}" class="btn-primary btn-md">
      Sign In
    </a>
  </div>
</div>
{% endblock %}
