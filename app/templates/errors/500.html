{% extends "base_fullscreen.html" %}

{% block title %}500 - Server Error{% endblock %}
{% block body_class %}bg-gray-50{% endblock %}

{% block content %}
<div class="flex items-center justify-center h-full p-6">
  <div class="text-center max-w-md">
    <div class="w-24 h-24 mx-auto mb-6 rounded-full bg-error-50 flex items-center justify-center">
      <svg class="w-12 h-12 text-error-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Something Went Wrong</h1>
    <p class="text-gray-500 mb-8">An unexpected error occurred. If this keeps happening, contact your system administrator.</p>
    <div class="flex items-center justify-center gap-3">
      <button onclick="window.location.reload()" class="btn-secondary btn-md">
        Try Again
      </button>
      <a href="{{ url_for('pages.pos') }}" class="btn-primary btn-md">
        Back to POS
      </a>
    </div>
  </div>
</div>
{% endblock %}
