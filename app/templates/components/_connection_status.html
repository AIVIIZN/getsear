<!-- Connection Status / Offline Indicator -->
<div x-data
     x-show="!$store.connection.online"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0 -translate-y-full"
     x-transition:enter-end="opacity-100 translate-y-0"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100 translate-y-0"
     x-transition:leave-end="opacity-0 -translate-y-full"
     class="fixed top-0 left-0 right-0 z-toast bg-warning-500 text-white px-4 py-2 flex items-center justify-center gap-3 text-sm font-semibold shadow-md"
     style="display: none;">

  <svg class="w-5 h-5 animate-pulse" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/>
  </svg>

  <span>OFFLINE &mdash; Orders saving locally</span>

  <!-- Pending sync count -->
  <span x-show="$store.connection.pendingCount > 0"
        x-text="'(' + $store.connection.pendingCount + ' pending)'"
        class="font-normal opacity-90"></span>

  <!-- Syncing indicator -->
  <span x-show="$store.connection.syncing" class="flex items-center gap-1.5 font-normal">
    <svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="31.4 31.4" stroke-linecap="round"/>
    </svg>
    Syncing...
  </span>

</div>
