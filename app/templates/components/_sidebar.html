       :class="$store.sidebar.expanded ? 'w-[240px]' : 'w-[64px]'"

       @mouseleave="$store.sidebar.hovered = false">

  <!-- Logo Area -->

       :class="$store.sidebar.expanded ? 'px-4 justify-start gap-3' : 'justify-center'">
    <!-- Flame icon -->
    <svg class="w-8 h-8 text-primary-500 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>

          x-transition:enter-start="opacity-0"
          x-transition:enter-end="opacity-100"
          class="text-white font-bold text-lg tracking-tight whitespace-nowrap">
      Sear POS

       :class="$store.sidebar.expanded ? '' : 'justify-center px-0'"
       title="Reports">
      <svg class="w-6 h-6 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"/>

  </nav>

  <!-- Bottom: User Section -->
  <div class="flex-shrink-0 border-t border-gray-800 p-3">
    <div class="flex items-center overflow-hidden"
         :class="$store.sidebar.expanded ? 'gap-3' : 'justify-center'">

      <!-- Avatar -->
      <div class="w-9 h-9 rounded-full bg-primary-700 flex items-center justify-center text-white text-sm font-semibold flex-shrink-0 relative">
        <span x-text="$store.auth.user ? ($store.auth.user.first_name || '').charAt(0) + ($store.auth.user.last_name || '').charAt(0) : 'S'"></span>
        <!-- Clock-in indicator -->
        <div x-show="$store.auth.clockedIn"
             class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-success-500 rounded-full border-2 border-gray-900"></div>
      </div>

      <!-- Name + Role (expanded only) -->
      <div x-show="$store.sidebar.expanded" x-cloak class="flex-1 min-w-0">
        <p class="text-sm font-medium text-gray-200 truncate"
           x-text="$store.auth.user ? $store.auth.user.display_name : 'Staff'"></p>
        <p class="text-xs text-gray-500 truncate"
           x-text="$store.auth.user ? $store.auth.user.role : ''"></p>
      </div>
    </div>

    <!-- Collapse Toggle -->
    <button @click="$store.sidebar.toggle()"
            class="btn-icon w-full mt-2 text-gray-500 hover:text-gray-300 hover:bg-gray-800"
            :class="$store.sidebar.expanded ? '' : 'mx-auto'"
            :title="$store.sidebar.expanded ? 'Collapse sidebar' : 'Expand sidebar'"
            :aria-label="$store.sidebar.expanded ? 'Collapse sidebar' : 'Expand sidebar'">
      <svg class="w-5 h-5 transition-transform duration-200"
           :class="$store.sidebar.expanded ? '' : 'rotate-180'"
           fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.75 19.5l-7.5-7.5 7.5-7.5m-6 15L5.25 12l7.5-7.5"/>
      </svg>
    </button>
  </div>

</aside>
