<!-- Modal System -->
<div x-data
     x-show="$store.modal.open"
     x-transition:enter="transition ease-out duration-150"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-100"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     @keydown.escape.window="$store.modal.close()"
     class="fixed inset-0 z-modal flex items-center justify-center p-4"
     style="display: none;"
     role="dialog"
     aria-modal="true">

  <!-- Overlay -->
  <div class="absolute inset-0 bg-black/50"
       @click="$store.modal.close()"></div>

  <!-- Modal Card -->
  <div class="relative bg-white rounded-xl shadow-xl max-h-[85vh] flex flex-col"
       x-show="$store.modal.open"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0 translate-y-4 scale-95"
       x-transition:enter-end="opacity-100 translate-y-0 scale-100"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100 translate-y-0 scale-100"
       x-transition:leave-end="opacity-0 translate-y-4 scale-95"
       :class="{
         'w-full max-w-[400px]': $store.modal.size === 'sm',
         'w-full max-w-[560px]': $store.modal.size === 'md',
         'w-full max-w-[720px]': $store.modal.size === 'lg',
         'w-full max-w-[960px]': $store.modal.size === 'xl',
       }"
       @click.stop>

    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 flex-shrink-0"
         x-show="$store.modal.title">
      <h2 class="text-xl font-semibold text-gray-900" x-text="$store.modal.title"></h2>
      <button @click="$store.modal.close()"
              class="btn-icon -mr-2"
              aria-label="Close modal">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Body (scrollable) -->
    <div class="flex-1 overflow-y-auto px-6 py-6" id="modal-body">
      <div x-html="$store.modal.content"></div>
    </div>

    <!-- Footer (optional, rendered via content) -->

  </div>

</div>
