<!-- Toast Notification System -->
<div x-data
     class="fixed top-4 left-1/2 -translate-x-1/2 z-toast flex flex-col items-center gap-2 pointer-events-none">

  <template x-for="toast in $store.toasts.items" :key="toast.id">
    <div class="pointer-events-auto"
         x-show="toast.visible"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 -translate-y-4"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 -translate-y-4">

      <!-- Success -->
      <div x-show="toast.type === 'success'" class="toast-success">
        <svg class="w-5 h-5 flex-shrink-0 text-success-500" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
        </svg>
        <span x-text="toast.message" class="flex-1"></span>
        <button @click="$store.toasts.remove(toast.id)" class="flex-shrink-0 text-success-500 hover:text-success-700 ml-2">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Error -->
      <div x-show="toast.type === 'error'" class="toast-error">
        <svg class="w-5 h-5 flex-shrink-0 text-error-500" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/>
        </svg>
        <span x-text="toast.message" class="flex-1"></span>
        <button @click="$store.toasts.remove(toast.id)" class="flex-shrink-0 text-error-500 hover:text-error-700 ml-2">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Warning -->
      <div x-show="toast.type === 'warning'" class="toast-warning">
        <svg class="w-5 h-5 flex-shrink-0 text-warning-500" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/>
        </svg>
        <span x-text="toast.message" class="flex-1"></span>
        <button @click="$store.toasts.remove(toast.id)" class="flex-shrink-0 text-warning-500 hover:text-warning-700 ml-2">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Info -->
      <div x-show="toast.type === 'info'" class="toast-info">
        <svg class="w-5 h-5 flex-shrink-0 text-info-500" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z"/>
        </svg>
        <span x-text="toast.message" class="flex-1"></span>
        <button @click="$store.toasts.remove(toast.id)" class="flex-shrink-0 text-info-500 hover:text-info-700 ml-2">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

    </div>
  </template>

</div>
