{#
  Inline numpad partial — used inside Alpine.js numpad() component.
  Renders the 4x3 grid of number keys plus action keys.
  Parent must have x-data="numpad()" or equivalent with press/backspace/clear methods.
#}
<div class="grid grid-cols-3 gap-2">
  <button @click="press('1')" class="h-16 rounded-xl bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-xl font-semibold text-gray-800 transition-colors" style="touch-action:manipulation">1</button>
  <button @click="press('2')" class="h-16 rounded-xl bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-xl font-semibold text-gray-800 transition-colors" style="touch-action:manipulation">2</button>
  <button @click="press('3')" class="h-16 rounded-xl bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-xl font-semibold text-gray-800 transition-colors" style="touch-action:manipulation">3</button>
  <button @click="press('4')" class="h-16 rounded-xl bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-xl font-semibold text-gray-800 transition-colors" style="touch-action:manipulation">4</button>
  <button @click="press('5')" class="h-16 rounded-xl bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-xl font-semibold text-gray-800 transition-colors" style="touch-action:manipulation">5</button>
  <button @click="press('6')" class="h-16 rounded-xl bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-xl font-semibold text-gray-800 transition-colors" style="touch-action:manipulation">6</button>
  <button @click="press('7')" class="h-16 rounded-xl bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-xl font-semibold text-gray-800 transition-colors" style="touch-action:manipulation">7</button>
  <button @click="press('8')" class="h-16 rounded-xl bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-xl font-semibold text-gray-800 transition-colors" style="touch-action:manipulation">8</button>
  <button @click="press('9')" class="h-16 rounded-xl bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-xl font-semibold text-gray-800 transition-colors" style="touch-action:manipulation">9</button>
  <button @click="press('00')" class="h-16 rounded-xl bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-xl font-semibold text-gray-800 transition-colors" style="touch-action:manipulation">00</button>
  <button @click="press('0')" class="h-16 rounded-xl bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-xl font-semibold text-gray-800 transition-colors" style="touch-action:manipulation">0</button>
  <button @click="backspace()" class="h-16 rounded-xl bg-gray-200 hover:bg-gray-300 active:bg-gray-400 flex items-center justify-center transition-colors" style="touch-action:manipulation">
    <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l7-7 11 0v14H10L3 12z"/></svg>
  </button>
</div>
<div class="flex gap-2 mt-2">
  <button @click="clear()" class="flex-1 h-12 rounded-xl bg-gray-200 hover:bg-gray-300 active:bg-gray-400 text-sm font-semibold text-gray-700 transition-colors" style="touch-action:manipulation">Clear</button>
</div>
