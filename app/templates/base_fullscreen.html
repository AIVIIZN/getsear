<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sear POS">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0F766E">
  <meta name="csrf-token" content="{{ csrf_token() if csrf_token is defined else '' }}">
  <title>{% block title %}Sear POS{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">

  {% block head %}{% endblock %}
</head>
<body class="h-full overflow-hidden font-sans no-select no-double-tap-zoom {% block body_class %}bg-gray-900{% endblock %}"
      x-data>

  <!-- Full viewport content, no sidebar, no topbar -->
  <main id="main-content" class="h-full w-full">
    {% block content %}{% endblock %}
  </main>

  <!-- Toast Container (still available on fullscreen pages) -->
  {% include "components/_toast.html" %}

  <!-- htmx -->
  <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>

  <!-- App JS -->
  <script src="{{ url_for('static', filename='js/alpine-stores.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>

  {% block scripts %}{% endblock %}
</body>
</html>
