{% extends "base_fullscreen.html" %}

{% block title %}Customer Display | Sear POS{% endblock %}
{% block body_class %}bg-white{% endblock %}

{% block head %}
<style>
  .cfd-root {
    height: 100vh;
    width: 100vw;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    overflow: hidden;
  }

  /* ---------- IDLE STATE ---------- */
  .cfd-idle {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    width: 100%;
    height: 100%;
  }

  .cfd-logo {
    max-height: 120px;
    max-width: 300px;
    object-fit: contain;
  }

  .cfd-welcome {
    font-size: 48px;
    font-weight: 700;
    color: #111827;
  }

  .cfd-slideshow {
    position: absolute;
    inset: 0;
    z-index: 0;
  }
  .cfd-slideshow img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 1s ease;
  }
  .cfd-slideshow img.active { opacity: 1; }
  .cfd-idle-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding: 40px;
    background: rgba(255,255,255,0.85);
    border-radius: 24px;
    backdrop-filter: blur(10px);
  }

  /* ---------- ORDERING STATE ---------- */
  .cfd-ordering {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    padding: 40px 60px;
  }

  .cfd-ordering-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .cfd-ordering-title {
    font-size: 28px;
    font-weight: 700;
    color: #111827;
  }

  .cfd-order-list {
    flex: 1;
    overflow-y: auto;
    padding-right: 20px;
  }

  .cfd-order-item {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #F3F4F6;
    animation: cfdSlideIn 0.3s ease-out;
  }

  @keyframes cfdSlideIn {
    from { transform: translateX(-20px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  .cfd-item-left {
    display: flex;
    gap: 12px;
    align-items: baseline;
  }

  .cfd-item-qty {
    font-size: 22px;
    font-weight: 600;
    color: #6B7280;
    min-width: 36px;
  }

  .cfd-item-name {
    font-size: 24px;
    font-weight: 500;
    color: #111827;
  }

  .cfd-item-mod {
    font-size: 18px;
    color: #6B7280;
    padding-left: 48px;
    line-height: 1.6;
  }

  .cfd-item-price {
    font-size: 24px;
    font-weight: 600;
    color: #111827;
    font-variant-numeric: tabular-nums;
  }

  .cfd-totals {
    margin-top: 20px;
    border-top: 2px solid #E5E7EB;
    padding-top: 16px;
  }

  .cfd-total-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
  }

  .cfd-total-label {
    font-size: 22px;
    color: #6B7280;
  }

  .cfd-total-value {
    font-size: 22px;
    font-weight: 500;
    color: #374151;
    font-variant-numeric: tabular-nums;
  }

  .cfd-total-row.grand .cfd-total-label {
    font-size: 36px;
    font-weight: 700;
    color: #111827;
  }
  .cfd-total-row.grand .cfd-total-value {
    font-size: 36px;
    font-weight: 700;
    color: #111827;
  }

  /* ---------- TIP STATE ---------- */
  .cfd-tip {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    gap: 32px;
    padding: 40px;
  }

  .cfd-tip-title {
    font-size: 36px;
    font-weight: 700;
    color: #111827;
  }

  .cfd-tip-amount {
    font-size: 48px;
    font-weight: 700;
    color: #0F766E;
  }

  .cfd-tip-buttons {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .cfd-tip-btn {
    width: 120px;
    height: 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    border: 2px solid #E5E7EB;
    background: white;
    cursor: pointer;
    transition: all 0.15s;
    gap: 4px;
  }
  .cfd-tip-btn:hover { border-color: #0F766E; background: #F0FDFA; }
  .cfd-tip-btn:active { transform: scale(0.95); }
  .cfd-tip-btn.selected { border-color: #0F766E; background: #CCFBF1; }

  .cfd-tip-btn .pct {
    font-size: 28px;
    font-weight: 700;
    color: #111827;
  }
  .cfd-tip-btn .amt {
    font-size: 18px;
    color: #6B7280;
  }

  .cfd-tip-btn.no-tip {
    border-color: #FCA5A5;
  }
  .cfd-tip-btn.no-tip:hover { background: #FEF2F2; }
  .cfd-tip-btn.no-tip .pct { color: #EF4444; font-size: 20px; }

  .cfd-tip-btn.custom-tip .pct { font-size: 20px; }

  .cfd-tip-confirm {
    margin-top: 16px;
    padding: 16px 48px;
    font-size: 24px;
    font-weight: 700;
    color: white;
    background: #0F766E;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.1s;
    min-height: 56px;
  }
  .cfd-tip-confirm:hover { background: #115E59; }
  .cfd-tip-confirm:active { transform: scale(0.97); }

  /* ---------- THANK YOU STATE ---------- */
  .cfd-thankyou {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    width: 100%;
    height: 100%;
  }

  .cfd-thankyou-text {
    font-size: 56px;
    font-weight: 700;
    color: #0F766E;
  }

  .cfd-thankyou-promo {
    font-size: 22px;
    color: #6B7280;
    text-align: center;
    max-width: 600px;
  }
</style>
{% endblock %}

{% block content %}
<div class="cfd-root"
     x-data="customerDisplay()"
     x-init="init()"
     :style="{ background: bgColor }">

  <!-- IDLE STATE -->
  <template x-if="state === 'idle'">
    <div class="cfd-idle">
      <!-- Optional slideshow -->
      <template x-if="slideshowImages.length > 0">
        <div class="cfd-slideshow">
          <template x-for="(img, i) in slideshowImages" :key="i">
            <img :src="img" :class="{ 'active': currentSlide === i }" alt="">
          </template>
        </div>
      </template>

      <div class="cfd-idle-content"
           :class="{ '': slideshowImages.length === 0 }">
        <img x-show="logoUrl" :src="logoUrl" alt="Logo" class="cfd-logo">
        <div class="cfd-welcome" x-text="welcomeText"></div>
      </div>
    </div>
  </template>

  <!-- ORDERING STATE -->
  <template x-if="state === 'ordering'">
    <div class="cfd-ordering">
      <div class="cfd-ordering-header">
        <div class="cfd-ordering-title">Your Order</div>
        <img x-show="logoUrl" :src="logoUrl" alt="" style="max-height:40px; opacity:0.6;">
      </div>

      <div class="cfd-order-list">
        <template x-for="item in orderItems" :key="item.id || item.name + item._idx">
          <div>
            <div class="cfd-order-item">
              <div class="cfd-item-left">
                <span class="cfd-item-qty" x-text="item.quantity + 'x'"></span>
                <span class="cfd-item-name" x-text="item.name"></span>
              </div>
              <span class="cfd-item-price" x-text="formatMoney(item.price * item.quantity)"></span>
            </div>
            <template x-for="mod in (item.modifiers || [])" :key="mod">
              <div class="cfd-item-mod" x-text="'+ ' + mod"></div>
            </template>
          </div>
        </template>
      </div>

      <div class="cfd-totals">
        <div class="cfd-total-row">
          <span class="cfd-total-label">Subtotal</span>
          <span class="cfd-total-value" x-text="formatMoney(subtotal)"></span>
        </div>
        <template x-if="discount > 0">
          <div class="cfd-total-row">
            <span class="cfd-total-label">Discount</span>
            <span class="cfd-total-value" style="color:#22C55E;" x-text="'-' + formatMoney(discount)"></span>
          </div>
        </template>
        <div class="cfd-total-row">
          <span class="cfd-total-label">Tax</span>
          <span class="cfd-total-value" x-text="formatMoney(tax)"></span>
        </div>
        <div class="cfd-total-row grand">
          <span class="cfd-total-label">Total</span>
          <span class="cfd-total-value" x-text="formatMoney(total)"></span>
        </div>
      </div>
    </div>
  </template>

  <!-- TIP STATE -->
  <template x-if="state === 'tip'">
    <div class="cfd-tip">
      <div class="cfd-tip-title">Add a tip?</div>
      <div class="cfd-tip-amount" x-text="formatMoney(total)"></div>

      <div class="cfd-tip-buttons">
        <template x-for="opt in tipOptions" :key="opt.pct">
          <div class="cfd-tip-btn"
               :class="{ 'selected': selectedTip === opt.pct }"
               @click="selectedTip = opt.pct">
            <span class="pct" x-text="opt.pct + '%'"></span>
            <span class="amt" x-text="formatMoney(Math.round(subtotal * opt.pct / 100))"></span>
          </div>
        </template>

        <div class="cfd-tip-btn custom-tip"
             :class="{ 'selected': selectedTip === 'custom' }"
             @click="showCustomTipModal = true; selectedTip = 'custom'; customTipInput = ''">
          <span class="pct">Custom</span>
          <span class="amt" x-show="customTipAmount > 0" x-text="formatMoney(customTipAmount)"></span>
        </div>

        <div class="cfd-tip-btn no-tip"
             :class="{ 'selected': selectedTip === 0 }"
             @click="selectedTip = 0">
          <span class="pct">No Tip</span>
        </div>
      </div>

      <button class="cfd-tip-confirm"
              @click="confirmTip()"
              x-text="'Confirm' + (tipAmount > 0 ? ' — ' + formatMoney(total + tipAmount) : '')">
      </button>
    </div>
  </template>

  <!-- THANK YOU STATE -->
  <template x-if="state === 'thankyou'">
    <div class="cfd-thankyou">
      <div class="cfd-thankyou-text">Thank you!</div>
      <div class="cfd-thankyou-promo" x-show="promoMessage" x-text="promoMessage"></div>
    </div>
  </template>

  <!-- CUSTOM TIP NUMPAD MODAL -->
  <div x-show="showCustomTipModal"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       @click.self="showCustomTipModal = false"
       style="position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:50; display:flex; align-items:center; justify-content:center;">
    <div @click.stop
         style="background:white; border-radius:24px; padding:32px; width:340px; box-shadow:0 25px 50px -12px rgba(0,0,0,0.25);">
      <div style="text-align:center; margin-bottom:24px;">
        <div style="font-size:22px; font-weight:700; color:#111827; margin-bottom:8px;">Enter Custom Tip</div>
        <div style="font-size:36px; font-weight:700; color:#0F766E; min-height:48px;"
             x-text="'$' + (customTipInput || '0.00')"></div>
      </div>
      <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:16px;">
        <template x-for="key in ['1','2','3','4','5','6','7','8','9','.','0','del']" :key="key">
          <button @click="handleTipNumpad(key)"
                  style="height:64px; min-height:48px; border-radius:12px; font-size:24px; font-weight:600; border:1px solid #E5E7EB; background:white; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background 0.1s;"
                  @mousedown="$el.style.background='#F3F4F6'"
                  @mouseup="$el.style.background='white'"
                  @touchstart="$el.style.background='#F3F4F6'"
                  @touchend="$el.style.background='white'"
                  x-text="key === 'del' ? '\u232B' : key"></button>
        </template>
      </div>
      <div style="display:flex; gap:12px;">
        <button @click="showCustomTipModal = false"
                style="flex:1; height:56px; min-height:48px; border-radius:12px; font-size:18px; font-weight:600; background:#F3F4F6; color:#374151; border:none; cursor:pointer;">
          Cancel
        </button>
        <button @click="applyCustomTip()"
                style="flex:1; height:56px; min-height:48px; border-radius:12px; font-size:18px; font-weight:700; background:#0F766E; color:white; border:none; cursor:pointer;">
          Apply
        </button>
      </div>
    </div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('customerDisplay', () => ({
    // State machine
    state: 'idle', // idle, ordering, tip, thankyou

    // Config
    logoUrl: '',
    welcomeText: 'Welcome!',
    bgColor: '#FFFFFF',
    promoMessage: '',
    slideshowImages: [],
    currentSlide: 0,

    // Order data
    orderItems: [],
    subtotal: 0,
    discount: 0,
    tax: 0,
    total: 0,

    // Tip
    tipOptions: [
      { pct: 18 },
      { pct: 20 },
      { pct: 22 },
    ],
    selectedTip: null,
    customTipAmount: 0,

    // Internal
    _eventSource: null,
    _slideshowInterval: null,
    _thankYouTimeout: null,
    _reconnectTimeout: null,
    _reconnectDelay: 1000,

    init() {
      const params = new URLSearchParams(window.location.search);
      this.logoUrl = params.get('logo') || this.$el.dataset.logo || '';
      this.bgColor = params.get('bg') || this.$el.dataset.bg || '#FFFFFF';
      this.promoMessage = params.get('promo') || this.$el.dataset.promo || '';

      const slideshowRaw = this.$el.dataset.slideshow || '';
      if (slideshowRaw) {
        try { this.slideshowImages = JSON.parse(slideshowRaw); }
        catch { this.slideshowImages = []; }
      }

      // Start slideshow
      if (this.slideshowImages.length > 1) {
        this._slideshowInterval = setInterval(() => {
          this.currentSlide = (this.currentSlide + 1) % this.slideshowImages.length;
        }, 5000);
      }

      // Connect SSE
      this._connectSSE();
    },

    destroy() {
      if (this._eventSource) this._eventSource.close();
      if (this._slideshowInterval) clearInterval(this._slideshowInterval);
      if (this._thankYouTimeout) clearTimeout(this._thankYouTimeout);
      if (this._reconnectTimeout) clearTimeout(this._reconnectTimeout);
    },

    _connectSSE() {
      if (this._eventSource) this._eventSource.close();

      const params = new URLSearchParams(window.location.search);
      const token = params.get('token') || this._getStoredToken();
      const locationId = params.get('location_id') || '';
      const terminalId = params.get('terminal_id') || '';

      let url = `/api/v1/events/orders?token=${encodeURIComponent(token)}&location_id=${encodeURIComponent(locationId)}`;
      if (terminalId) url += `&terminal_id=${encodeURIComponent(terminalId)}`;

      const es = new EventSource(url);
      this._eventSource = es;

      es.addEventListener('order.item_added', (e) => {
        const data = JSON.parse(e.data);
        this.state = 'ordering';
        this._addOrderItem(data);
      });

      es.addEventListener('order.updated', (e) => {
        const data = JSON.parse(e.data);
        this.state = 'ordering';
        this._updateOrder(data);
      });

      es.addEventListener('order.totals', (e) => {
        const data = JSON.parse(e.data);
        this.subtotal = data.subtotal || 0;
        this.discount = data.discount || 0;
        this.tax = data.tax || 0;
        this.total = data.total || 0;
      });

      es.addEventListener('payment.tip_request', (e) => {
        const data = JSON.parse(e.data);
        this.subtotal = data.subtotal || this.subtotal;
        this.total = data.total || this.total;
        this.state = 'tip';
        this.selectedTip = null;
        this.customTipAmount = 0;
      });

      es.addEventListener('payment.complete', (e) => {
        this._showThankYou();
      });

      es.addEventListener('display.idle', () => {
        this._resetToIdle();
      });

      es.addEventListener('display.config', (e) => {
        const data = JSON.parse(e.data);
        if (data.logo) this.logoUrl = data.logo;
        if (data.bg) this.bgColor = data.bg;
        if (data.welcome) this.welcomeText = data.welcome;
        if (data.promo) this.promoMessage = data.promo;
        if (data.slideshow) this.slideshowImages = data.slideshow;
      });

      es.onopen = () => { this._reconnectDelay = 1000; };
      es.onerror = () => {
        es.close();
        this._eventSource = null;
        this._reconnectTimeout = setTimeout(() => this._connectSSE(), this._reconnectDelay);
        this._reconnectDelay = Math.min(this._reconnectDelay * 2, 30000);
      };
    },

    _getStoredToken() {
      try {
        const token = localStorage.getItem('sear_token');
        if (token) return token;
      } catch { /* ignore */ }
      return '';
    },

    _addOrderItem(data) {
      const item = {
        id: data.id || data.name + Date.now(),
        name: data.name || '',
        quantity: data.quantity || 1,
        price: data.price || 0,
        modifiers: data.modifiers || [],
        _idx: this.orderItems.length,
      };
      this.orderItems.push(item);

      if (data.subtotal !== undefined) this.subtotal = data.subtotal;
      if (data.tax !== undefined) this.tax = data.tax;
      if (data.total !== undefined) this.total = data.total;
    },

    _updateOrder(data) {
      if (data.items) {
        this.orderItems = data.items.map((item, i) => ({
          id: item.id || item.name + i,
          name: item.name || '',
          quantity: item.quantity || 1,
          price: item.price || 0,
          modifiers: item.modifiers || [],
          _idx: i,
        }));
      }
      if (data.subtotal !== undefined) this.subtotal = data.subtotal;
      if (data.discount !== undefined) this.discount = data.discount;
      if (data.tax !== undefined) this.tax = data.tax;
      if (data.total !== undefined) this.total = data.total;
    },

    _showThankYou() {
      this.state = 'thankyou';
      this._thankYouTimeout = setTimeout(() => {
        this._resetToIdle();
      }, 3000);
    },

    _resetToIdle() {
      this.state = 'idle';
      this.orderItems = [];
      this.subtotal = 0;
      this.discount = 0;
      this.tax = 0;
      this.total = 0;
      this.selectedTip = null;
      this.customTipAmount = 0;
    },

    // Custom tip modal
    showCustomTipModal: false,
    customTipInput: '',

    // Tip actions
    get tipAmount() {
      if (this.selectedTip === 0) return 0;
      if (this.selectedTip === 'custom') return this.customTipAmount;
      if (typeof this.selectedTip === 'number' && this.selectedTip > 0) {
        return Math.round(this.subtotal * this.selectedTip / 100);
      }
      return 0;
    },

    handleTipNumpad(key) {
      if (key === 'del') {
        this.customTipInput = this.customTipInput.slice(0, -1);
      } else if (key === '.') {
        if (!this.customTipInput.includes('.')) {
          this.customTipInput += key;
        }
      } else {
        const dotIdx = this.customTipInput.indexOf('.');
        if (dotIdx !== -1 && this.customTipInput.length - dotIdx > 2) return;
        this.customTipInput += key;
      }
    },

    applyCustomTip() {
      const parsed = parseFloat(this.customTipInput);
      if (!isNaN(parsed) && parsed >= 0) {
        this.customTipAmount = Math.round(parsed * 100);
      }
      this.showCustomTipModal = false;
    },

    async confirmTip() {
      const token = new URLSearchParams(window.location.search).get('token') || this._getStoredToken();
      try {
        await fetch('/api/v1/payments/tip', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ tip_amount: this.tipAmount }),
        });
      } catch (err) {
        console.error('CFD: Tip submission failed', err);
      }
      this._showThankYou();
    },

    // Formatting
    formatMoney(cents) {
      if (cents == null) return '$0.00';
      return '$' + (cents / 100).toFixed(2);
    },
  }));
});
</script>
{% endblock %}
