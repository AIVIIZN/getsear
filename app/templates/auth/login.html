{% extends "base_fullscreen.html" %}

{% block title %}Login - Sear POS{% endblock %}
{% block body_class %}bg-gray-950{% endblock %}

{% block content %}
<div class="flex items-center justify-center h-full p-4" x-data="loginForm">

  <div class="w-full max-w-sm">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 mx-auto bg-primary-700 rounded-2xl flex items-center justify-center mb-4">
        <svg class="w-10 h-10 text-white" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white">Sear POS</h1>
      <p class="text-gray-400 text-sm mt-1">Sign in to your account</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-xl shadow-lg p-8" :class="shake && 'animate-shake'">
      <form @submit.prevent="submit">

        <!-- Email -->
        <div class="mb-4">
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input id="email"
                 type="email"
                 x-model="email"
                 class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                 placeholder="you@restaurant.com"
                 required
                 autocomplete="email"
                 autofocus>
        </div>

        <!-- Password -->
        <div class="mb-6">
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input id="password"
                 type="password"
                 x-model="password"
                 class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                 placeholder="Enter your password"
                 required
                 autocomplete="current-password">
        </div>

        <!-- Error message -->
        <div x-show="error" x-cloak
             class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm"
             x-text="error">
        </div>

        <!-- Submit -->
        <button type="submit"
                class="w-full h-12 bg-primary-700 hover:bg-primary-800 text-white font-semibold rounded-lg transition-colors flex items-center justify-center gap-2"
                :disabled="!email || !password || loading">
          <svg x-show="loading" x-cloak class="w-5 h-5 animate-spin" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="31.4 31.4" stroke-linecap="round"/>
          </svg>
          <span x-text="loading ? 'Signing in...' : 'Sign In'">Sign In</span>
        </button>

      </form>

      <!-- Forgot Password -->
      <div class="text-center mt-4">
        <a href="/forgot-password" class="text-sm text-primary-600 hover:text-primary-700 font-medium">
          Forgot Password?
        </a>
      </div>
    </div>

    <!-- PIN Login Link -->
    <div class="text-center mt-6">
      <a href="{{ url_for('pages.pin_login') }}" class="text-sm text-gray-400 hover:text-gray-300 font-medium">
        Staff PIN Login
      </a>
    </div>
  </div>

</div>

<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('loginForm', () => ({
    email: '',
    password: '',
    error: '',
    loading: false,
    shake: false,

    submit() {
      this.loading = true;
      this.error = '';

      fetch('/api/v1/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: this.email, password: this.password }),
      })
      .then(resp => resp.json())
      .then(data => {
        if (data.ok && data.data && data.data.access_token) {
          localStorage.setItem('sear_token', data.data.access_token);
          document.cookie = 'sear_token=' + data.data.access_token + '; path=/; SameSite=Strict';
          window.location.href = '/pos';
        } else {
          this.error = data.message || 'Invalid email or password';
          this.shake = true;
          setTimeout(() => { this.shake = false; }, 300);
        }
      })
      .catch(() => {
        this.error = 'Connection error. Please try again.';
      })
      .finally(() => {
        this.loading = false;
      });
    }
  }));
});
</script>
{% endblock %}
